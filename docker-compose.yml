services:

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - huggingface_cache:/root/.cache/huggingface
    environment:
      QDRANT_URL: http://qdrant:6333
      POSTGRES_URL: postgresql+psycopg://cat_rag:cat_rag@postgres:5432/cat_rag
      REDIS_URL: redis://redis:6379/0
      REDIS_CACHE_URL: redis://redis:6379/0
      REDIS_SESSION_URL: redis://redis:6379/1
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cat_rag
      POSTGRES_USER: cat_rag
      POSTGRES_PASSWORD: cat_rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cat_rag -d cat_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:

  qdrant_data:
  postgres_data:
  redis_data:
  huggingface_cache:
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cat_rag
          POSTGRES_USER: cat_rag
          POSTGRES_PASSWORD: cat_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cat_rag -d cat_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379

      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            huggingface-${{ runner.os }}-

      - name: Run tests
        env:
          APP_ENV: test
          QDRANT_URL: http://localhost:6333
          POSTGRES_URL: postgresql+psycopg://cat_rag:cat_rag@localhost:5432/cat_rag
          REDIS_URL: redis://localhost:6379/0
          REDIS_CACHE_URL: redis://localhost:6379/0
          REDIS_SESSION_URL: redis://localhost:6379/1
          LLM_MODEL: openai/gpt-oss-20b
          PYTHONPATH: .
        run: |
          pytest -q